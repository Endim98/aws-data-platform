
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check sample dataset exists
        run: test -f data/sales.csv

      - name: Check CSV header
        run: |
          python -c "import csv; f=open('data/sales.csv', encoding='utf-8-sig', newline=''); header=next(csv.reader(f)); assert header == ['order_id', 'order_date', 'product', 'quantity', 'unit_price'], f'Unexpected CSV header: {header}'; print('CSV header is valid')"

      - name: Confirm Terraform configuration directory exists
        run: test -d terraform
