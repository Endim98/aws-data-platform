
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check sample dataset exists
        run: test -f data/sales.csv

      - name: Check CSV header
        run: |
          head -n 1 data/sales.csv | grep -Fx "order_id,order_date,product,quantity,unit_price"

      - name: Confirm Terraform configuration directory exists
        run: test -d terraform
